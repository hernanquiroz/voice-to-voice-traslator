<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎙️ Traductor de Voz a Voz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 40px;
    max-width: 700px;
    width: 100%;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; color: #333; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 0.95rem; }

  .langs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .langs label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: 600; }
  select {
    width: 100%;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    font-size: 1rem;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  select:focus { outline: none; border-color: #667eea; }

  .record-btn {
    width: 100%;
    padding: 20px;
    border: none;
    border-radius: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
  }
  .record-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(102,126,234,0.5); }
  .record-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .record-btn.recording {
    background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 20px rgba(245,101,101,0.4); }
    50% { box-shadow: 0 8px 40px rgba(245,101,101,0.8); }
  }

  .result {
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    display: none;
  }
  .result.show { display: block; }
  .result.transcript { background: #f0f4ff; border-left: 4px solid #667eea; }
  .result.translation { background: #f0fff4; border-left: 4px solid #48bb78; }
  .result .label { font-size: 0.8rem; text-transform: uppercase; color: #666; margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; }
  .result .text { font-size: 1.15rem; color: #222; line-height: 1.5; }

  .status {
    margin-top: 16px;
    text-align: center;
    font-size: 0.9rem;
    color: #666;
    min-height: 20px;
  }
  .status.error { color: #c53030; font-weight: 600; }

  .actions { display: flex; gap: 12px; margin-top: 16px; }
  .actions button {
    flex: 1;
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 12px;
    background: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    color: #444;
    transition: all 0.2s;
  }
  .actions button:hover { border-color: #667eea; color: #667eea; }

  .warning {
    background: #fffaf0;
    border: 1px solid #f6ad55;
    color: #7b341e;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.85rem;
    margin-bottom: 20px;
    display: none;
  }

  /* ── Crédito dentro de la tarjeta (footer) ────────────── */
  .credit {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid #ececec;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #888;
    letter-spacing: 0.3px;
  }
  .credit .heart {
    color: #e53e3e;
    animation: beat 1.6s infinite;
    font-size: 0.9rem;
  }
  .credit strong {
    color: #667eea;
    font-weight: 700;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.25); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ Traductor de Voz a Voz</h1>
  <p class="subtitle">Habla, traduzco y te respondo con voz — sin servidor, todo en tu navegador.</p>

  <div class="warning" id="warning">
    ⚠️ Tu navegador no soporta reconocimiento de voz. Usa <strong>Chrome, Edge o Safari</strong> actualizados.
  </div>

  <div class="langs">
    <div>
      <label>🗣️ Hablo en...</label>
      <select id="origen"></select>
    </div>
    <div>
      <label>🔊 Respondo en...</label>
      <select id="destino"></select>
    </div>
  </div>

  <button class="record-btn" id="btnGrabar">⏺️ Pulsar para grabar</button>

  <div class="result transcript" id="resTranscripcion">
    <div class="label">📝 Escuché</div>
    <div class="text" id="textoTranscrito"></div>
  </div>

  <div class="result translation" id="resTraduccion">
    <div class="label">🔁 Traducción</div>
    <div class="text" id="textoTraducido"></div>
    <div class="actions">
      <button id="btnRepetir">🔊 Repetir</button>
      <button id="btnCopiar">📋 Copiar</button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <!-- Crédito de autoría (dentro de la tarjeta) -->
  <div class="credit">
    <span class="heart">♥</span>
    Diseñada por: <strong>Ing. Hernán Quiroz</strong>
  </div>
</div>

<script>
// ─── Idiomas disponibles ────────────────────────────────────
const IDIOMAS = {
  "es":    { nombre: "🇪🇸 Español",   voz: "es-ES", google: "es"    },
  "en":    { nombre: "🇺🇸 Inglés",     voz: "en-US", google: "en"    },
  "pt":    { nombre: "🇧🇷 Portugués",  voz: "pt-BR", google: "pt"    },
  "fr":    { nombre: "🇫🇷 Francés",    voz: "fr-FR", google: "fr"    },
  "de":    { nombre: "🇩🇪 Alemán",     voz: "de-DE", google: "de"    },
  "it":    { nombre: "🇮🇹 Italiano",   voz: "it-IT", google: "it"    },
  "ja":    { nombre: "🇯🇵 Japonés",    voz: "ja-JP", google: "ja"    },
  "zh":    { nombre: "🇨🇳 Chino",      voz: "zh-CN", google: "zh-CN" },
  "ko":    { nombre: "🇰🇷 Coreano",    voz: "ko-KR", google: "ko"    },
  "ru":    { nombre: "🇷🇺 Ruso",       voz: "ru-RU", google: "ru"    },
  "ar":    { nombre: "🇸🇦 Árabe",      voz: "ar-SA", google: "ar"    },
  "hi":    { nombre: "🇮🇳 Hindi",      voz: "hi-IN", google: "hi"    },
  "nl":    { nombre: "🇳🇱 Holandés",   voz: "nl-NL", google: "nl"    },
  "tr":    { nombre: "🇹🇷 Turco",      voz: "tr-TR", google: "tr"    },
  "pl":    { nombre: "🇵🇱 Polaco",     voz: "pl-PL", google: "pl"    },
  "sv":    { nombre: "🇸🇪 Sueco",      voz: "sv-SE", google: "sv"    },
  "el":    { nombre: "🇬🇷 Griego",     voz: "el-GR", google: "el"    },
  "he":    { nombre: "🇮🇱 Hebreo",     voz: "he-IL", google: "iw"    },
  "th":    { nombre: "🇹🇭 Tailandés",  voz: "th-TH", google: "th"    },
  "vi":    { nombre: "🇻🇳 Vietnamita", voz: "vi-VN", google: "vi"    }
};

// ─── Rellenar los <select> ──────────────────────────────────
const selOrigen = document.getElementById("origen");
const selDestino = document.getElementById("destino");
for (const [code, info] of Object.entries(IDIOMAS)) {
  selOrigen.innerHTML += `<option value="${code}">${info.nombre}</option>`;
  selDestino.innerHTML += `<option value="${code}">${info.nombre}</option>`;
}
selOrigen.value = "es";
selDestino.value = "en";

// ─── Elementos del DOM ──────────────────────────────────────
const btnGrabar = document.getElementById("btnGrabar");
const status = document.getElementById("status");
const resTrans = document.getElementById("resTranscripcion");
const resTrad = document.getElementById("resTraduccion");
const textoTranscrito = document.getElementById("textoTranscrito");
const textoTraducido = document.getElementById("textoTraducido");
const warning = document.getElementById("warning");

// ─── Detectar soporte del navegador ─────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  warning.style.display = "block";
  btnGrabar.disabled = true;
}

// ─── Estado ─────────────────────────────────────────────────
let grabando = false;
let reconocimiento = null;

function setStatus(msg, isError = false) {
  status.textContent = msg;
  status.className = "status" + (isError ? " error" : "");
}

// ─── Función: iniciar grabación ─────────────────────────────
function iniciarGrabacion() {
  if (!SR) return;

  reconocimiento = new SR();
  reconocimiento.lang = IDIOMAS[selOrigen.value].voz;
  reconocimiento.continuous = false;
  reconocimiento.interimResults = false;
  reconocimiento.maxAlternatives = 1;

  reconocimiento.onstart = () => {
    grabando = true;
    btnGrabar.textContent = "⏹️ Detener y traducir";
    btnGrabar.classList.add("recording");
    setStatus("🎤 Escuchando... habla ahora");
    resTrans.classList.remove("show");
    resTrad.classList.remove("show");
  };

  reconocimiento.onresult = async (event) => {
    const texto = event.results[0][0].transcript;
    textoTranscrito.textContent = texto;
    resTrans.classList.add("show");
    setStatus("🔁 Traduciendo...");

    try {
      const traduccion = await traducir(texto, selOrigen.value, selDestino.value);
      textoTraducido.textContent = traduccion;
      resTrad.classList.add("show");
      setStatus("🔊 Hablando...");
      hablar(traduccion, selDestino.value);
      setStatus("✅ Listo");
    } catch (e) {
      console.error(e);
      setStatus("❌ Error al traducir: " + e.message, true);
    }
  };

  reconocimiento.onerror = (event) => {
    console.error("SpeechRecognition error:", event.error);
    let msg = "❌ Error de reconocimiento: " + event.error;
    if (event.error === "not-allowed") msg = "❌ Permiso de micrófono denegado.";
    if (event.error === "no-speech")   msg = "🎤 No detecté voz. Intenta de nuevo.";
    if (event.error === "network")     msg = "❌ Error de red en el reconocimiento.";
    setStatus(msg, true);
    detenerGrabacion();
  };

  reconocimiento.onend = () => {
    detenerGrabacion();
  };

  reconocimiento.start();
}

function detenerGrabacion() {
  grabando = false;
  btnGrabar.textContent = "⏺️ Pulsar para grabar";
  btnGrabar.classList.remove("recording");
  if (reconocimiento) {
    try { reconocimiento.stop(); } catch(e) {}
  }
}

// ─── Traducción: Google primero, MyMemory como respaldo ─────
async function traducir(texto, srcCode, tgtCode) {
  if (!texto.trim()) throw new Error("Texto vacío");

  const src = IDIOMAS[srcCode].google;
  const tgt = IDIOMAS[tgtCode].google;

  // 1) Google Translate (endpoint público, sin API key)
  try {
    const g = await traducirGoogle(texto, src, tgt);
    if (g && g.trim() && g.trim().toLowerCase() !== texto.trim().toLowerCase()) {
      console.log("✅ Traducido con Google");
      return g;
    }
  } catch (e) {
    console.warn("Google falló:", e);
  }

  // 2) MyMemory como respaldo
  try {
    const m = await traducirMyMemory(texto, srcCode, tgtCode);
    if (m && m.trim() && m.trim().toLowerCase() !== texto.trim().toLowerCase()) {
      console.log("✅ Traducido con MyMemory");
      return m;
    }
  } catch (e) {
    console.warn("MyMemory falló:", e);
  }

  // 3) Si ambos devolvieron el mismo texto, avisamos
  throw new Error("No se pudo traducir a este idioma. Prueba con otro destino.");
}

// Google Translate endpoint público
async function traducirGoogle(texto, src, tgt) {
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(texto)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const data = await resp.json();
  // data[0] es un array de segmentos; los unimos
  const partes = data[0].map(seg => seg[0]).filter(Boolean);
  return partes.join("");
}

// MyMemory (respaldo)
async function traducirMyMemory(texto, srcCode, tgtCode) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=${srcCode}|${tgtCode}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error("HTTP " + resp.status);
  const data = await resp.json();
  if (data.responseStatus !== 200) {
    throw new Error(data.responseDetails || "Servicio no disponible");
  }
  return data.responseData.translatedText;
}

// ─── Texto a voz nativo ─────────────────────────────────────
function hablar(texto, langCode) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = IDIOMAS[langCode].voz;
  utter.rate = 1;
  utter.pitch = 1;

  const voces = window.speechSynthesis.getVoices();
  const prefijo = IDIOMAS[langCode].voz.slice(0, 2);
  const voz = voces.find(v => v.lang.toLowerCase().startsWith(prefijo));
  if (voz) utter.voice = voz;

  window.speechSynthesis.speak(utter);
}

// ─── Eventos ────────────────────────────────────────────────
btnGrabar.addEventListener("click", () => {
  if (grabando) detenerGrabacion();
  else iniciarGrabacion();
});

document.getElementById("btnRepetir").addEventListener("click", () => {
  if (textoTraducido.textContent) {
    hablar(textoTraducido.textContent, selDestino.value);
  }
});

document.getElementById("btnCopiar").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(textoTraducido.textContent);
    setStatus("📋 Copiado al portapapeles");
    setTimeout(() => setStatus("✅ Listo"), 2000);
  } catch (e) {
    setStatus("❌ No se pudo copiar", true);
  }
});

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}
</script>
</body>
</html>
